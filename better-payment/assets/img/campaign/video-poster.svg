<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Better Payment campaign video placeholder" preserveAspectRatio="xMidYMid slice">
  <!--
    Poster frame for the Campaign Builder's Video element on a FREE install.

    Drawn, never fetched: the builder must not pull a real thumbnail from
    img.youtube.com — that needs Pro-owned URL parsing and would send the admin's
    IP to Google on every preview render. See ProElementPreview::video().

    Palette is deliberately the product's own: Better Payment indigo (#6b63f6 /
    #5a7ff0, shared with ai-default-hero.svg) lighting the top-left, Pro's orange
    (#ec6a2b / #f6a821) lighting the bottom-right. The heart-in-hands mark is the
    same one ai-default-hero.svg uses, so generated and placeholder campaign
    artwork read as one family.

    WHAT MAKES IT READ AS A PHOTOGRAPH RATHER THAN A DIAGRAM, in order of how much
    each one does — none of these are ornament, and removing them flattens it:
      1. A silhouetted crowd along the bottom. Flat vector panels (this used to be
         three grey "builder column" rectangles) look like a chart; out-of-focus
         people look like a frame from a campaign film, and fundraising is about
         people. It also creates a real foreground.
      2. Depth of field. The crowd and the bokeh are Gaussian-blurred at different
         radii, so the image has near/far planes instead of one flat sheet.
      3. Film grain over everything. This is the single cheapest realism cue —
         perfectly clean gradients read as vector art to the eye.
      4. Light shafts that fade out along their length, rather than flat-opacity
         diagonal bands, which read as stray geometry.

    THE CENTRE IS KEPT CLEAR ON PURPOSE. The red play pill sits dead centre and
    the "Get PRO to Unlock" button lands just below it; motifs live in the left and
    right thirds and along the bottom, so neither button ever covers artwork or
    fights it for attention. Anything added here must respect that gap.
  -->
  <defs>
    <linearGradient id="bpvBase" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#252c52"/>
      <stop offset="0.55" stop-color="#151b31"/>
      <stop offset="1" stop-color="#0a0e18"/>
    </linearGradient>

    <!-- Better Payment indigo, keying the scene from the top left. -->
    <radialGradient id="bpvGlowIndigo" cx="230" cy="140" r="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6b63f6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6b63f6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bpvGlowBlue" cx="690" cy="250" r="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5a7ff0" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#5a7ff0" stop-opacity="0"/>
    </radialGradient>

    <!-- Pro's orange, answering from the bottom right. -->
    <radialGradient id="bpvGlowPro" cx="1010" cy="600" r="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ec6a2b" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ec6a2b" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bpvProBar" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f6a821"/>
      <stop offset="1" stop-color="#ec6a2b"/>
    </linearGradient>

    <!-- Light shafts fade along their length instead of being flat bands. -->
    <linearGradient id="bpvShaft" x1="0" y1="0" x2="0" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Warm floor bounce under the crowd. -->
    <linearGradient id="bpvFloor" x1="0" y1="470" x2="0" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0e18" stop-opacity="0"/>
      <stop offset="1" stop-color="#05070d" stop-opacity="0.72"/>
    </linearGradient>

    <radialGradient id="bpvHeartHalo" cx="232" cy="330" r="215" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a9b4ff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#a9b4ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Darkens the edges so the duration pill stays legible. -->
    <radialGradient id="bpvVignette" cx="600" cy="338" r="720" gradientUnits="userSpaceOnUse">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <filter id="bpvBokeh" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="bpvCrowdFar" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="bpvCrowdNear" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="bpvShaftSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <!-- Film grain. Desaturated fractal noise, laid over the whole frame. -->
    <filter id="bpvGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bpvBase)"/>
  <rect width="1200" height="675" fill="url(#bpvGlowIndigo)"/>
  <rect width="1200" height="675" fill="url(#bpvGlowBlue)"/>
  <rect width="1200" height="675" fill="url(#bpvGlowPro)"/>

  <!-- Light shafts, softened and faded. -->
  <g filter="url(#bpvShaftSoft)" fill="url(#bpvShaft)">
    <path d="M170 675 L630 -40 L742 -40 L282 675 Z"/>
    <path d="M470 675 L930 -40 L986 -40 L526 675 Z"/>
  </g>

  <!-- Out-of-focus bokeh — the far plane. -->
  <g filter="url(#bpvBokeh)">
    <circle cx="128" cy="96" r="58" fill="#ffffff" opacity="0.07"/>
    <circle cx="1094" cy="536" r="92" fill="#ffb27a" opacity="0.10"/>
    <circle cx="1016" cy="112" r="30" fill="#ffffff" opacity="0.09"/>
    <circle cx="196" cy="576" r="24" fill="#ffffff" opacity="0.08"/>
    <circle cx="880" cy="330" r="36" fill="#ffd0a8" opacity="0.07"/>
  </g>

  <!-- ── Left third: heart-in-hands, shared with ai-default-hero.svg ── -->
  <rect x="0" y="100" width="470" height="470" fill="url(#bpvHeartHalo)"/>
  <g transform="translate(232 330) scale(0.60)" fill="#ffffff" opacity="0.17">
    <path d="M-190 70 C-150 150 -70 190 0 190 C70 190 150 150 190 70 C150 120 70 145 0 145 C-70 145 -150 120 -190 70 Z"/>
    <path d="M-150 40 C-120 108 -60 140 0 140 C60 140 120 108 150 40 C120 82 60 104 0 104 C-60 104 -120 82 -150 40 Z" opacity="0.6"/>
    <path d="M0 -30 C-26 -84 -108 -80 -132 -24 C-152 22 -120 66 -60 112 L0 156 L60 112 C120 66 152 22 132 -24 C108 -80 26 -84 0 -30 Z"/>
  </g>

  <!-- ── Right third: a campaign progress card — the Campaign Builder motif ── -->
  <g transform="translate(838 218)">
    <rect x="0" y="0" width="270" height="176" rx="18"
          fill="#ffffff" fill-opacity="0.07"
          stroke="#ffffff" stroke-opacity="0.20" stroke-width="2"/>
    <rect x="26" y="30" width="146" height="12" rx="6" fill="#ffffff" opacity="0.42"/>
    <rect x="26" y="54" width="196" height="8" rx="4" fill="#ffffff" opacity="0.18"/>
    <rect x="26" y="88" width="218" height="12" rx="6" fill="#ffffff" opacity="0.18"/>
    <rect x="26" y="88" width="142" height="12" rx="6" fill="url(#bpvProBar)"/>
    <rect x="26" y="114" width="62" height="8" rx="4" fill="#ffffff" opacity="0.34"/>
    <rect x="182" y="114" width="62" height="8" rx="4" fill="#ffffff" opacity="0.20"/>
    <rect x="26" y="138" width="112" height="22" rx="11" fill="#ffffff" opacity="0.30"/>
  </g>

  <!-- ── Donation coins ── -->
  <g opacity="0.15">
    <circle cx="1052" cy="176" r="24" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M1052 163 v26 M1046 169 h9 a4.6 4.6 0 0 1 0 9 h-8 a4.6 4.6 0 0 0 0 9 h9"
          fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
  </g>
  <g opacity="0.10">
    <circle cx="742" cy="470" r="17" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M742 461 v18 M737 465 h6.5 a3.4 3.4 0 0 1 0 6.6 h-5.6 a3.4 3.4 0 0 0 0 6.6 h6.5"
          fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- Floor bounce, sitting under the crowd so they read as standing in it. -->
  <rect x="0" y="470" width="1200" height="205" fill="url(#bpvFloor)"/>

  <!-- ── Foreground: a silhouetted crowd of supporters ──
       Two planes at different blur radii. Heads sit above the bottom edge and
       shoulders run off it, so the crowd is cropped by the frame the way a real
       foreground would be. -->
  <g fill="#05070d">
    <g filter="url(#bpvCrowdFar)" opacity="0.62">
      <g transform="translate(96 600)"><circle cy="-26" r="21"/><path d="M-42 75 q0 -68 42 -68 q42 0 42 68 Z"/></g>
      <g transform="translate(214 616)"><circle cy="-22" r="18"/><path d="M-36 59 q0 -58 36 -58 q36 0 36 58 Z"/></g>
      <g transform="translate(330 604)"><circle cy="-25" r="20"/><path d="M-40 71 q0 -65 40 -65 q40 0 40 65 Z"/></g>
      <g transform="translate(452 620)"><circle cy="-21" r="17"/><path d="M-34 55 q0 -55 34 -55 q34 0 34 55 Z"/></g>
      <g transform="translate(742 618)"><circle cy="-22" r="18"/><path d="M-36 57 q0 -57 36 -57 q36 0 36 57 Z"/></g>
      <g transform="translate(860 606)"><circle cy="-25" r="20"/><path d="M-40 69 q0 -64 40 -64 q40 0 40 64 Z"/></g>
      <g transform="translate(982 620)"><circle cy="-21" r="17"/><path d="M-34 55 q0 -55 34 -55 q34 0 34 55 Z"/></g>
      <g transform="translate(1096 608)"><circle cy="-24" r="19"/><path d="M-38 67 q0 -62 38 -62 q38 0 38 62 Z"/></g>
    </g>

    <!-- Nearer, softer figures at the edges — the depth cue that sells it. -->
    <g filter="url(#bpvCrowdNear)" opacity="0.72">
      <g transform="translate(20 604)"><circle cy="-34" r="30"/><path d="M-60 105 q0 -96 60 -96 q60 0 60 96 Z"/></g>
      <g transform="translate(1176 598)"><circle cy="-36" r="32"/><path d="M-64 113 q0 -102 64 -102 q64 0 64 102 Z"/></g>
      <g transform="translate(596 640)" opacity="0.55"><circle cy="-28" r="24"/><path d="M-48 78 q0 -76 48 -76 q48 0 48 76 Z"/></g>
    </g>
  </g>

  <rect width="1200" height="675" fill="url(#bpvVignette)"/>

  <!-- Grain last, over everything. -->
  <rect width="1200" height="675" filter="url(#bpvGrain)" opacity="0.085" style="mix-blend-mode:overlay"/>
</svg>
